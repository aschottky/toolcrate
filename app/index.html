  <body class="audit-test-page">
    <header class="site-header">
      <div class="container header-inner">
        <a href="../" class="logo">ToolCrate</a>
        <span class="audit-badge">Step 2 · Run audit</span>
      </div>
    </header>

    <main class="container audit-main">
      <div id="payment-success" class="payment-success" hidden>
        <strong></strong>
        Enter a website URL below to generate the review.
      </div>

      <section class="audit-intro">
        <h1>Run a website review</h1>
        <p>
          Paste the website URL. It reads the public pages and generates a
          plain report across 7 areas (SEO, leads, mobile, trust, messaging, performance, security) — plus 3 fixes you
          can act on today.
        </p>
      </section>

      <form id="audit-form" class="audit-form" novalidate>
        <label for="website-url">Your website URL</label>
        <div class="audit-form-row">
          <input
            id="website-url"
            name="websiteUrl"
            type="url"
            inputmode="url"
            placeholder="https://your-business.com"
            autocomplete="url"
            required
          />
          <button type="submit" class="btn btn-primary" id="run-audit-btn">
            Run Audit
          </button>
        </div>
      </form>

      <div id="audit-status" class="audit-status" hidden aria-live="polite"></div>
      <div id="audit-error" class="audit-error" hidden role="alert"></div>
      <div id="audit-results" class="audit-results" hidden></div>
    </main>

  </body>
