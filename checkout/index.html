<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Checkout — ToolCrate</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700&family=Instrument+Serif:ital@0;1&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../styles/main.css" />
    <style>
      body.checkout-page {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 2.5rem 1.25rem 3rem;
      }

      .checkout-shell {
        width: min(100%, 640px);
        text-align: center;
      }

      .checkout-logo {
        display: inline-block;
        margin-bottom: 2rem;
        font-weight: 700;
        font-size: 1.125rem;
        letter-spacing: 0.02em;
        color: var(--text);
        text-decoration: none;
      }

      .checkout-logo:hover {
        color: var(--accent);
      }

      #checkout-loading {
        margin: 0 0 1.5rem;
        color: var(--text-muted);
        font-size: 0.95rem;
      }

      #checkout {
        min-height: 420px;
        text-align: left;
      }

      .checkout-error {
        margin: 0;
        padding: 1rem 1.25rem;
        border-radius: var(--radius);
        background: rgba(232, 93, 42, 0.08);
        border: 1px solid rgba(232, 93, 42, 0.25);
        color: var(--text);
        font-size: 0.95rem;
        line-height: 1.5;
      }
    </style>
  </head>
  <body class="checkout-page">
    <div class="checkout-shell">
      <a href="../" class="checkout-logo">ToolCrate</a>
      <p id="checkout-loading">Preparing your checkout...</p>
      <div id="checkout"></div>
    </div>

    <script type="module" src="./checkout.js"></script>
  </body>
</html>
