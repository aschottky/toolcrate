    <style>
      body.checkout-page {
        min-height: 100vh;
        display: flex;
        flex-direction: column;

      }

      .checkout-shell {
        width: min(100%, 640px);
        text-align: center;
      }

      .checkout-logo {
        display: inline-block;
        margin-bottom: 2rem;
        font-weight: 700;
        font-size: 1.125rem;
        letter-spacing: 0.02em;
        color: var(--text);
        text-decoration: none;
      }

      .checkout-logo:hover {
        color: var(--accent);
      }

      #checkout-loading {
        margin: 0 0 1.5rem;
        color: var(--text-muted);
        font-size: 0.95rem;
      }

      #checkout {
        min-height: 420px;
        text-align: left;
      }

      .checkout-error {
        margin: 0;
        padding: 1rem 1.25rem;
        border-radius: var(--radius);
        background: rgba(232, 93, 42, 0.08);
        border: 1px solid rgba(232, 93, 42, 0.25);
