<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-1JPM7QNHFN"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-1JPM7QNHFN');
    </script>
    <meta name="robots" content="noindex, nofollow" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Your Custom Conversion Redesign — ToolCrate</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        background: #0f172a;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      .view-header {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        z-index: 20;
        padding: 0.75rem 1.25rem;
        background: rgba(15, 23, 42, 0.92);
        backdrop-filter: blur(8px);
        border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        text-align: center;
      }

      .view-header p {
        margin: 0;
        color: #e2e8f0;
        font-size: 0.95rem;
        font-weight: 600;
      }

      .view-loader {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        color: #94a3b8;
        padding-top: 3rem;
      }

      .spinner {
        width: 44px;
        height: 44px;
        margin-bottom: 1.25rem;
        border: 4px solid rgba(255, 255, 255, 0.15);
        border-top-color: #f97316;
        border-radius: 50%;
        animation: spin 0.9s linear infinite;
      }

      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }

      .preview-frame {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        border: none;
        background: #fff;
        padding-top: 2.75rem;
      }

      .preview-gate {
        position: fixed;
        inset: 0;
        z-index: 30;
        background: #0f172a;
        display: flex;
        align-items: center;
        justify-content: center;
        opacity: 1;
        transition: opacity 0.3s ease;
      }

      .preview-gate.is-hidden {
        opacity: 0;
        pointer-events: none;
      }

      .view-error {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 2rem;
        text-align: center;
        color: #e2e8f0;
      }

      .view-error h1 {
        color: #fca5a5;
        margin: 0 0 0.5rem;
      }

      [hidden] {
        display: none !important;
      }
    </style>
  </head>
  <body>
    <header class="view-header">
      <p>Your custom design preview</p>
    </header>

    <div class="view-loader" id="loader">
      <div class="spinner" aria-hidden="true"></div>
      <p>Loading your preview…</p>
    </div>

    <script type="module" src="./preview-view.js"></script>
  </body>
</html>
