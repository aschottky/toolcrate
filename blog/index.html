<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="index, follow" />
    <title>Blog — ToolCrate</title>
    <meta name="description" content="Insights on websites, conversions, and growing your business online from ToolCrate." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/styles/main.css" />
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-1JPM7QNHFN"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-1JPM7QNHFN');
    </script>
    <style>
      /* Homepage header + dark theme (index.html uses inline CSS — not in main.css) */
      body.blog-page {
        min-height: 100vh;
        margin: 0;
        background: #0a0a0a !important;
        color: #e4e4e7 !important;
        font-family: "DM Sans", system-ui, sans-serif;
        line-height: 1.6;
        -webkit-font-smoothing: antialiased;
      }

      body.blog-page > header {
        position: fixed !important;
        top: 0;
        left: 0;
        right: 0;
        z-index: 99999 !important;
        background: rgba(9, 9, 11, 0.8);
        backdrop-filter: blur(16px);
        border-bottom: 1px solid rgba(255, 255, 255, 0.05);
      }

      body.blog-page > header nav {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 1rem;
        padding: 1rem 1.5rem;
        max-width: 80rem;
        width: 100%;
        margin: 0 auto;
        font-family: "Inter", -apple-system, BlinkMacSystemFont, sans-serif;
      }

      body.blog-page header nav a.logo {
        display: inline-flex;
        align-items: baseline;
        text-decoration: none;
        font-size: 1.5rem;
        font-weight: 400;
        color: #fff;
        letter-spacing: normal;
        background: none;
        -webkit-text-fill-color: unset;
      }

      body.blog-page header nav a.logo .logo-accent {
        color: #f97316;
      }

      body.blog-page header nav .nav-links {
        display: flex;
        gap: 2rem;
        align-items: center;
        list-style: none !important;
        margin: 0;
        padding: 0;
      }

      body.blog-page header nav .nav-links a {
        color: #a1a1aa;
        text-decoration: none;
        font-size: 0.875rem;
        font-weight: 500;
        transition: color 0.2s ease;
      }

      body.blog-page header nav .nav-links a:hover,
      body.blog-page header nav .nav-links a.is-current {
        color: #e4e4e7;
      }

      body.blog-page header nav .nav-cta {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        padding: 0.625rem 1.25rem;
        border-radius: 9999px;
        background: #f8fafc;
        color: #0f172a;
        font-size: 0.875rem;
        font-weight: 700;
        text-decoration: none;
        border: 2px solid #f8fafc;
        white-space: nowrap;
        transition: transform 0.2s ease, box-shadow 0.2s ease;
      }

      body.blog-page header nav .nav-cta:hover {
        transform: translateY(-1px);
        box-shadow: 0 0 24px rgba(248, 250, 252, 0.15);
      }

      .hamburger {
        display: none;
        flex-direction: column;
        cursor: pointer;
        gap: 5px;
      }

      .hamburger span {
        width: 25px;
        height: 2px;
        background: #e4e4e7;
        transition: all 0.3s ease;
      }

      .hamburger.active span:nth-child(1) {
        transform: rotate(45deg) translate(7px, 7px);
      }

      .hamburger.active span:nth-child(2) {
        opacity: 0;
      }

      .hamburger.active span:nth-child(3) {
        transform: rotate(-45deg) translate(6px, -6px);
      }

      .blog-main {
        padding: 6rem 24px 4rem;
      }

      body.blog-post-view .blog-intro {
        display: none;
      }

      body.blog-post-view .blog-main {
        padding-top: 5.5rem;
      }

      .blog-main .container {
        max-width: 900px;
        margin: 0 auto;
      }

      .blog-intro {
        max-width: 42rem;
        margin: 0 auto 2.5rem;
        text-align: center;
      }

      .blog-intro h1 {
        font-family: "Instrument Serif", Georgia, serif;
        font-size: clamp(2rem, 5vw, 2.75rem);
        font-weight: 400;
        color: #e4e4e7;
        margin: 0 0 1rem;
        line-height: 1.15;
      }

      .blog-intro p {
        margin: 0;
        color: #a1a1aa;
        font-size: 1.125rem;
        line-height: 1.7;
      }

      #soro-blog {
        width: 100%;
        margin: 0 auto;
        scroll-margin-top: 5.5rem;
      }

      body.blog-post-view #soro-blog {
        scroll-margin-top: 5.5rem;
      }

      body.blog-post-view #soro-blog .soro-blog {
        margin-top: 0;
      }

      @media (max-width: 768px) {
        body.blog-page header nav .nav-links {
          position: fixed;
          top: 65px;
          left: 0;
          right: 0;
          background: rgba(9, 9, 11, 0.98);
          backdrop-filter: blur(12px);
          flex-direction: column;
          padding: 2rem;
          gap: 1.5rem;
          display: none;
          border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        body.blog-page header nav .nav-links.active {
          display: flex;
        }

        body.blog-page header nav .hamburger {
          display: flex;
        }

        body.blog-page header nav .nav-cta {
          font-size: 0.8125rem;
          padding: 0.5rem 1rem;
        }
      }
    </style>
  </head>
  <body class="blog-page">
    <script>
      if (new URLSearchParams(location.search).has("post")) {
        document.body.classList.add("blog-post-view");
      }
    </script>
    <header>
        <nav>
            <a href="/" class="logo">Tool<span class="logo-accent">Crate</span></a>
            <ul class="nav-links" id="navLinks">
                <li><a href="/#work">Our Work</a></li>
                <li><a href="/#results">Results</a></li>
                <li><a href="/#pricing">Pricing</a></li>
                <li><a href="/#about">About</a></li>
                <li><a href="/blog/" class="is-current" aria-current="page">Blog</a></li>
            </ul>
            <a href="/try/" class="nav-cta">Get My Free Preview.</a>
            <div class="hamburger" id="hamburger">
                <span></span>
                <span></span>
                <span></span>
            </div>
        </nav>
    </header>

    <main class="blog-main">
      <div class="container">
        <div class="blog-intro" id="blog-intro">
          <h1>Blog</h1>
          <p>Insights on websites, conversions, and growing your business online.</p>
        </div>

        <div id="soro-blog"></div>
        <script src="https://app.trysoro.com/api/embed/9d3f8837-a8f6-4848-a8e8-7546fb8db7e2?theme=dark" defer></script>
      </div>
    </main>

    <script type="module" src="./blog.js"></script>
  </body>
</html>
