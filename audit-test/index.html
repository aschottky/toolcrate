<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-1JPM7QNHFN"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-1JPM7QNHFN');
    </script>
    <meta name="robots" content="noindex, nofollow" />
    <title>Audit Test — Website Tear Down</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700&family=Instrument+Serif:ital@0;1&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../styles/main.css" />
    <link rel="stylesheet" href="../styles/audit-test.css" />
  </head>
  <body class="audit-test-page">
    <header class="site-header">
      <div class="container header-inner">
        <a href="../" class="logo">Website Tear Down</a>
        <span class="audit-badge">Internal test</span>
      </div>
    </header>

    <main class="container audit-main">
      <div id="payment-success" class="payment-success" hidden>
        <strong>Payment received.</strong>
        Enter your website URL below to run the audit.
      </div>

      <section class="audit-intro">
        <h1>AI Site Audit (MVP)</h1>
        <p>
          Enter a live website URL. The backend scrapes public HTML, sends it to OpenAI,
          returns scores across 7 areas, and auto-downloads a PDF report (same as production).
        </p>
      </section>

      <form id="audit-form" class="audit-form" novalidate>
        <label for="website-url">Website URL</label>
        <div class="audit-form-row">
          <input
            id="website-url"
            name="websiteUrl"
            type="url"
            inputmode="url"
            placeholder="https://example-plumber.com"
            autocomplete="url"
            required
          />
          <button type="submit" class="btn btn-primary" id="run-audit-btn">
            Run Audit
          </button>
        </div>
      </form>

      <div id="audit-status" class="audit-status" hidden aria-live="polite"></div>
      <div id="audit-error" class="audit-error" hidden role="alert"></div>
      <div id="audit-results" class="audit-results" hidden></div>
    </main>

    <script type="module" src="./audit-test.js"></script>
  </body>
</html>
