<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Page Not Found — ToolCrate</title>
    <script>
      (function () {
        var url =
          window.location.pathname +
          window.location.search +
          window.location.hash;

        if (
          url.indexOf("/tools/") !== -1 ||
          url.indexOf("/guides/") !== -1 ||
          url.indexOf("/calculator") !== -1
        ) {
          window.location.replace("/try/");
          return;
        }

        document.documentElement.classList.add("show-404");
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Instrument+Serif:ital@0;1&display=swap"
      rel="stylesheet"
    />
    <style>
      html:not(.show-404) body {
        visibility: hidden;
      }

      *, *::before, *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 2rem 1.5rem;
        font-family: "DM Sans", system-ui, sans-serif;
        background: #0a0a0a;
        color: #e4e4e7;
        line-height: 1.6;
        -webkit-font-smoothing: antialiased;
        text-align: center;
      }

      .not-found {
        max-width: 28rem;
      }

      .not-found h1 {
        font-family: "Instrument Serif", Georgia, serif;
        font-size: clamp(2rem, 6vw, 2.75rem);
        font-weight: 400;
        line-height: 1.15;
        margin-bottom: 1rem;
        color: #fafafa;
      }

      .not-found p {
        color: #a1a1aa;
        font-size: 1.0625rem;
        margin-bottom: 2rem;
      }

      .not-found a {
        display: inline-block;
        padding: 14px 32px;
        background: linear-gradient(135deg, #3b82f6 0%, #8b5cf6 100%);
        color: #ffffff;
        text-decoration: none;
        border-radius: 12px;
        font-weight: 600;
        font-size: 1rem;
        transition: transform 0.2s ease, box-shadow 0.2s ease;
        box-shadow: 0 10px 40px rgba(59, 130, 246, 0.3);
      }

      .not-found a:hover {
        transform: translateY(-2px);
        box-shadow: 0 15px 50px rgba(59, 130, 246, 0.4);
      }
    </style>
  </head>
  <body>
    <main class="not-found">
      <h1>Page Not Found</h1>
      <p>The page you're looking for doesn't exist or has moved.</p>
      <a href="/">Back to Toolcrate</a>
    </main>
  </body>
</html>
