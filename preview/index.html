<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Your Website Preview — ToolCrate</title>
    <style>
      :root {
        color-scheme: light;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #0f172a;
        color: #e2e8f0;
        text-align: center;
      }
      .preview-loader {
        padding: 2rem;
      }
      .spinner {
        width: 44px;
        height: 44px;
        margin: 0 auto 1.25rem;
        border: 4px solid rgba(255, 255, 255, 0.15);
        border-top-color: #f97316;
        border-radius: 50%;
        animation: spin 0.9s linear infinite;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
      h1 {
        font-size: 1.3rem;
        font-weight: 600;
        margin: 0 0 0.5rem;
      }
      p {
        margin: 0;
        color: #94a3b8;
        font-size: 0.95rem;
      }
      .error h1 {
        color: #fca5a5;
      }
    </style>
  </head>
  <body>
    <div class="preview-loader" id="loader">
      <div class="spinner" aria-hidden="true"></div>
      <h1>Loading your website preview…</h1>
      <p>This is a design concept prepared just for you.</p>
    </div>
    <script type="module" src="./preview.js"></script>
  </body>
</html>
