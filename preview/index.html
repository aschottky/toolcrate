<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Your Website Preview — ToolCrate</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        color-scheme: dark;
        --bg: #0f172a;
        --orange: #f97316;
        --text: #ffffff;
        --muted: #94a3b8;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: var(--bg);
        color: var(--text);
      }

      /* ---------- Initial loader (first fetch) ---------- */
      .preview-loader {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 2rem;
        text-align: center;
        color: #e2e8f0;
      }
      .spinner {
        width: 44px;
        height: 44px;
        margin: 0 auto 1.25rem;
        border: 4px solid rgba(255, 255, 255, 0.15);
        border-top-color: var(--orange);
        border-radius: 50%;
        animation: spin 0.9s linear infinite;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
      .preview-loader h1 {
        font-size: 1.3rem;
        font-weight: 600;
        margin: 0 0 0.5rem;
      }
      .preview-loader p {
        margin: 0;
        color: var(--muted);
        font-size: 0.95rem;
      }
      .error h1 {
        color: #fca5a5;
      }

      /* ---------- Wait screen ---------- */
      #wait {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 4rem 1.5rem 3rem;
        opacity: 1;
        transition: opacity 0.6s ease;
      }
      #wait.is-leaving {
        opacity: 0;
      }
      .wait-content {
        width: 100%;
        max-width: 640px;
        text-align: center;
      }
      .wait-disclaimer {
        color: #64748b;
        font-size: 0.8rem;
        text-align: center;
        margin: 0 0 1.5rem;
      }

      /* Progress bar */
      .progress-track {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        height: 4px;
        background: rgba(255, 255, 255, 0.08);
        z-index: 10;
      }
      .progress-fill {
        height: 100%;
        width: 0%;
        background: linear-gradient(90deg, var(--orange), #fb923c);
        box-shadow: 0 0 12px rgba(249, 115, 22, 0.6);
        transition: width 0.4s ease;
      }
      .progress-fill.is-running {
        /* 0% → 90% over 4 minutes, then holds until polling confirms ready */
        animation: progress-crawl 240s linear forwards;
      }
      .progress-fill.is-done {
        animation: none;
        width: 100% !important;
      }
      @keyframes progress-crawl {
        from {
          width: 0%;
        }
        to {
          width: 90%;
        }
      }

      /* Stage block */
      .stage {
        min-height: 170px;
        opacity: 1;
        transition: opacity 0.45s ease;
      }
      .stage.is-fading {
        opacity: 0;
      }
      .stage-title {
        font-size: clamp(1.5rem, 4.5vw, 2rem);
        font-weight: 800;
        letter-spacing: -0.02em;
        margin: 0 0 1.25rem;
      }
      .stage-steps {
        list-style: none;
        margin: 0;
        padding: 0;
        display: flex;
        flex-direction: column;
        gap: 0.5rem;
      }
      .stage-steps li {
        color: var(--muted);
        font-size: 0.98rem;
        opacity: 0;
        animation: fade-up 0.7s ease forwards;
      }
      .stage-steps li::before {
        content: "·";
        color: var(--orange);
        font-weight: 800;
        margin-right: 0.5rem;
      }
      @keyframes fade-up {
        from {
          opacity: 0;
          transform: translateY(8px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      /* Ready banner */
      .ready-banner {
        font-size: clamp(1.5rem, 4.5vw, 2rem);
        font-weight: 800;
        margin: 0;
        animation: fade-up 0.5s ease forwards;
      }

      /* Fact card */
      .fact-card {
        margin: 2.5rem auto 0;
        padding: 1.5rem 1.75rem;
        background: rgba(255, 255, 255, 0.05);
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 1rem;
        text-align: left;
        opacity: 1;
        transition: opacity 0.4s ease;
      }
      .fact-card.is-fading {
        opacity: 0;
      }
      .fact-label {
        display: block;
        color: var(--orange);
        font-size: 0.78rem;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        margin-bottom: 0.5rem;
      }
      .fact-quote {
        margin: 0;
        font-style: italic;
        font-size: 1.02rem;
        line-height: 1.55;
        color: var(--text);
      }

      /* Interactive question */
      .question {
        margin-top: 2.5rem;
        opacity: 0;
        transform: translateY(10px);
        transition: opacity 0.7s ease, transform 0.7s ease;
        pointer-events: none;
      }
      .question.is-visible {
        opacity: 1;
        transform: translateY(0);
        pointer-events: auto;
      }
      .question-kicker {
        margin: 0 0 0.35rem;
        color: var(--muted);
        font-size: 0.9rem;
      }
      .question-title {
        margin: 0 0 1.1rem;
        font-size: 1.15rem;
        font-weight: 700;
      }
      .pills {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 0.6rem;
      }
      .pill {
        font-family: inherit;
        font-size: 0.92rem;
        font-weight: 500;
        color: var(--text);
        background: rgba(255, 255, 255, 0.05);
        border: 1px solid rgba(255, 255, 255, 0.15);
        border-radius: 999px;
        padding: 0.6rem 1.1rem;
        cursor: pointer;
        transition: border-color 0.2s ease, color 0.2s ease, background 0.2s ease;
      }
      .pill:hover {
        border-color: rgba(249, 115, 22, 0.6);
      }
      .pill.is-selected {
        border-color: var(--orange);
        color: var(--orange);
        background: rgba(249, 115, 22, 0.08);
      }
      .pills.is-answered .pill {
        cursor: default;
        opacity: 0.55;
      }
      .pills.is-answered .pill.is-selected {
        opacity: 1;
      }
      .question-thanks {
        margin: 1rem 0 0;
        font-weight: 600;
        color: var(--text);
        animation: fade-up 0.5s ease forwards;
      }

      [hidden] {
        display: none !important;
      }
    </style>
  </head>
  <body>
    <div class="preview-loader" id="loader">
      <div class="spinner" aria-hidden="true"></div>
      <h1>Loading your website preview…</h1>
      <p>This is a design concept prepared just for you.</p>
    </div>

    <div id="wait" hidden>
      <div class="progress-track" aria-hidden="true">
        <div class="progress-fill" id="progress-fill"></div>
      </div>

      <div class="wait-content">
        <p class="wait-disclaimer">
          We'll email you when your preview is ready - you don't have to keep this tab open.
        </p>
        <div class="stage" id="stage" aria-live="polite">
          <h1 class="stage-title" id="stage-title"></h1>
          <ul class="stage-steps" id="stage-steps"></ul>
        </div>

        <div class="fact-card" id="fact-card">
          <span class="fact-label">Did you know?</span>
          <p class="fact-quote" id="fact-quote"></p>
        </div>

        <div class="question" id="question">
          <p class="question-kicker">Quick question while we build this…</p>
          <h2 class="question-title">What's your biggest challenge right now?</h2>
          <div class="pills" id="pills">
            <button type="button" class="pill" data-intent="not_enough_calls">
              🔥 Not enough inbound calls
            </button>
            <button type="button" class="pill" data-intent="competitors_look_better">
              😤 Competitors look more professional
            </button>
            <button type="button" class="pill" data-intent="bad_on_mobile">
              📱 My site looks bad on phones
            </button>
            <button type="button" class="pill" data-intent="unsure_about_traffic">
              🤷 I don't know if my site gets traffic
            </button>
          </div>
          <p class="question-thanks" id="question-thanks" hidden>Got it, thanks! 👊</p>
        </div>
      </div>
    </div>

    <script type="module" src="./preview.js"></script>
  </body>
</html>
